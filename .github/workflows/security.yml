name: Security gates

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Automated tests
        run: pnpm test
      - name: Production VPS build
        run: pnpm build:vps
      - name: Package validated release
        run: |
          set -euo pipefail
          bash scripts/package-vps.sh /tmp/neta-vps-release.tar.gz
          rm -rf /tmp/neta-release-artifact
          mkdir -p /tmp/neta-release-artifact
          cp /tmp/neta-vps-release.tar.gz /tmp/neta-release-artifact/neta-vps-release.tar.gz
          cp deploy/nginx-netarandevu.conf /tmp/neta-release-artifact/neta-nginx.conf
      - name: Upload validated release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neta-vps-release-${{ github.event.pull_request.number || github.run_id }}
          path: /tmp/neta-release-artifact
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  gitleaks:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog verified secret scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: 3.97.9
          extra_args: --results=verified,unknown

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Semgrep outside repository
        run: |
          set -euo pipefail
          python3 -m venv /tmp/neta-semgrep-venv
          /tmp/neta-semgrep-venv/bin/pip install --disable-pip-version-check 'semgrep==1.177.0'
      - name: Semgrep OWASP scan
        run: |
          set -euo pipefail
          /tmp/neta-semgrep-venv/bin/semgrep scan \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude node_modules \
            --exclude .next \
            --exclude dist \
            --exclude coverage \
            .

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
