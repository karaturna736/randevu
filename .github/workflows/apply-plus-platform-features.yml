name: Apply Plus platform features
on:
  push:
    branches: [feat/plus-platform-features]
    paths:
      - .github/workflows/apply-plus-platform-features.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plus-platform-features
          fetch-depth: 0
      - name: Apply deterministic source patches
        run: |
          sed -i '/Assert both existing slot extractions/d' scripts/apply-plus-platform-features.mjs
          node scripts/apply-plus-platform-features.mjs
      - name: Remove one-shot patch files
        run: rm scripts/apply-plus-platform-features.mjs .github/workflows/apply-plus-platform-features.yml
      - name: Commit feature sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Plus web sitesi, yönetim API ve şube otomasyonunu ürünleştir'
          git push origin HEAD:feat/plus-platform-features
