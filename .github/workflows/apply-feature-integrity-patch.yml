name: Apply feature integrity patch

on:
  push:
    branches:
      - audit/feature-integrity
    paths:
      - .github/workflows/apply-feature-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/feature-integrity
          fetch-depth: 0
      - name: Apply deterministic feature audit fixes
        run: node scripts/apply-feature-integrity-patch.mjs
      - name: Remove one-shot patch files
        run: |
          rm -f scripts/apply-feature-integrity-patch.mjs
          rm -f .github/workflows/apply-feature-integrity-patch.yml
      - name: Commit audited sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Paket kotalarını ve gerçek özellik kapsamını düzelt"
          git push origin HEAD:audit/feature-integrity
