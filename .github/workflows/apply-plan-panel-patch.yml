name: Apply plan panel patch

on:
  push:
    branches:
      - fix/plan-panel-visibility
    paths:
      - scripts/patch-plan-panel.mjs
      - .github/workflows/apply-plan-panel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic package visibility patch
        run: node scripts/patch-plan-panel.mjs
      - name: Remove one-shot patch files
        run: git rm scripts/patch-plan-panel.mjs .github/workflows/apply-plan-panel-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/entitlements.ts lib/workspace.ts lib/setup.ts lib/branches.ts components/product/dashboard.tsx components/product/growth.tsx components/product/branches.tsx
          git diff --cached --check
          git commit -m "Paketlere göre panel özelliklerini ayır"
          git push origin HEAD:fix/plan-panel-visibility
