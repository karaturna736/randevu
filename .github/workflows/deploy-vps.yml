name: VDS production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_load_test:
        description: "Deploy sonrası izole 100 kullanıcı senkronizasyon testini çalıştır"
        required: false
        default: false
        type: boolean

concurrency:
  group: neta-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build:vps
      - run: bash scripts/package-vps.sh /tmp/neta-vps-release.tar.gz
      - name: Verify SSH host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS production secret is missing. Pin one of the host keys printed below after verifying it with the hosting console."
            ssh-keyscan -T 10 "$VPS_HOST" 2>/dev/null | tee /tmp/neta-known-hosts
            test -s /tmp/neta-known-hosts
            ssh-keygen -lf /tmp/neta-known-hosts -E sha256
            exit 1
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256
      - name: Install deploy key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          scp -o BatchMode=yes /tmp/neta-vps-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/neta-vps-release-${GITHUB_SHA}.tar.gz"
      - name: Deploy with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/neta-release /tmp/neta-vps-release-${GITHUB_SHA}.tar.gz"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "test -f /etc/letsencrypt/live/netarandevu.com/fullchain.pem || sudo /usr/local/sbin/neta-enable-ssl '$LETSENCRYPT_EMAIL'"
      - name: Verify production
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 https://netarandevu.com/api/health
          curl --fail --show-error --silent --head https://netarandevu.com
          auth_status="$(curl --fail --show-error --silent --retry 6 --retry-delay 3 https://netarandevu.com/api/v1/auth-status)"
          AUTH_STATUS="$auth_status" node -e 'const x=JSON.parse(process.env.AUTH_STATUS||"{}"); if(x.google!==true){console.error("Google production auth is not ready"); process.exit(1)}'
      - name: Run isolated 100-user synchronization test
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_load_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[loadtest]')) }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "set -a; source /etc/neta/neta.env; set +a; ALLOW_LOAD_TEST=1 LOAD_TEST_USERS=100 node /opt/neta/current/scripts/load-test-100.mjs"
