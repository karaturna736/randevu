name: VDS production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_load_test:
        description: "Deploy sonrası izole 250 kullanıcı ağır eşzamanlılık testini çalıştır"
        required: false
        default: false
        type: boolean

concurrency:
  group: neta-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Automated tests
        run: pnpm test
      - name: Production VPS build
        run: pnpm build:vps
      - name: Package immutable release
        run: bash scripts/package-vps.sh /tmp/neta-vps-release.tar.gz
      - name: Verify SSH host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS production secret is missing. Pin one of the host keys printed below after verifying it with the hosting console."
            ssh-keyscan -T 10 "$VPS_HOST" 2>/dev/null | tee /tmp/neta-known-hosts
            test -s /tmp/neta-known-hosts
            ssh-keygen -lf /tmp/neta-known-hosts -E sha256
            exit 1
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256
      - name: Install deploy key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
      - name: Upload release and Nginx policy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          SCP_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"
          timeout 8m scp $SCP_OPTS /tmp/neta-vps-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/neta-vps-release-${GITHUB_SHA}.tar.gz"
          timeout 2m scp $SCP_OPTS deploy/nginx-netarandevu.conf "$VPS_USER@$VPS_HOST:/tmp/neta-nginx-${GITHUB_SHA}.conf"
      - name: Deploy with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          timeout 18m ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "set -e; sudo /usr/local/sbin/neta-release /tmp/neta-vps-release-${GITHUB_SHA}.tar.gz; test -f /etc/letsencrypt/live/netarandevu.com/fullchain.pem || sudo /usr/local/sbin/neta-enable-ssl '$LETSENCRYPT_EMAIL'; sudo install -o root -g root -m 0644 /tmp/neta-nginx-${GITHUB_SHA}.conf /etc/nginx/sites-available/netarandevu; sudo nginx -t; sudo systemctl reload nginx; rm -f /tmp/neta-nginx-${GITHUB_SHA}.conf"
      - name: Verify production and security headers
        run: |
          set -euo pipefail
          CURL_BASE=(--connect-timeout 8 --max-time 25 --fail --show-error --silent)
          CURL_RETRY=(--retry 6 --retry-delay 3 --retry-connrefused --retry-all-errors)

          curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" https://netarandevu.com/api/health
          headers="$(curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" --head https://netarandevu.com)"
          printf '%s\n' "$headers"
          for required in \
            'content-security-policy:' \
            'strict-transport-security:' \
            'x-content-type-options:' \
            'x-frame-options:' \
            'referrer-policy:' \
            'permissions-policy:' \
            'cross-origin-opener-policy:' \
            'cross-origin-resource-policy:'; do
            grep -qi "^${required}" <<< "$headers" || { echo "::error::Missing security header: ${required}"; exit 1; }
          done
          grep -qi "script-src-attr 'none'" <<< "$headers" || { echo "::error::CSP must block inline event-handler attributes"; exit 1; }
          if grep -qi '^x-powered-by:' <<< "$headers"; then
            echo "::error::X-Powered-By must not be exposed"
            exit 1
          fi
          if grep -Eqi '^server:[[:space:]]*[^[:space:]]+/[0-9]' <<< "$headers"; then
            echo "::error::Web server version must not be exposed"
            exit 1
          fi
          api_headers="$(curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" --head https://netarandevu.com/api/health)"
          grep -qi '^cache-control:.*no-store' <<< "$api_headers" || { echo "::error::API responses must be non-cacheable at the edge"; exit 1; }
          for path in '/.git/config' '/.env' '/package.json' '/pnpm-lock.yaml' '/server.js' '/neta.sqlite' '/backup.sql'; do
            if ! status="$(curl --connect-timeout 5 --max-time 15 --silent --output /dev/null --write-out '%{http_code}' "https://netarandevu.com${path}")"; then
              echo "::error::Sensitive path ${path} request failed or timed out"
              exit 1
            fi
            case "$status" in
              403|404) ;;
              *) echo "::error::Sensitive path ${path} returned HTTP ${status}"; exit 1 ;;
            esac
          done
          auth_status="$(curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" https://netarandevu.com/api/v1/auth-status)"
          AUTH_STATUS="$auth_status" node -e 'const x=JSON.parse(process.env.AUTH_STATUS||"{}"); if(x.google!==true){console.error("Google production auth is not ready"); process.exit(1)}'
      - name: Run isolated 250-user heavy synchronization test
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_load_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[loadtest]')) }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          timeout 15m ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VPS_USER@$VPS_HOST" "set -a; source /etc/neta/neta.env; set +a; LOAD_TEST_USERS=250 bash /opt/neta/current/scripts/run-isolated-load-test.sh"
