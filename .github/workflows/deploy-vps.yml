name: VDS production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_load_test:
        description: "Deploy sonrası izole 250 kullanıcı ağır eşzamanlılık testini çalıştır"
        required: false
        default: false
        type: boolean

concurrency:
  group: neta-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Automated tests
        run: pnpm test
      - name: Production VPS build
        run: pnpm build:vps
      - name: Package immutable release
        run: bash scripts/package-vps.sh /tmp/neta-vps-release.tar.gz
      - name: Verify SSH host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS production secret is missing. Pin one of the host keys printed below after verifying it with the hosting console."
            ssh-keyscan -T 10 "$VPS_HOST" 2>/dev/null | tee /tmp/neta-known-hosts
            test -s /tmp/neta-known-hosts
            ssh-keygen -lf /tmp/neta-known-hosts -E sha256
            exit 1
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256
      - name: Install deploy key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/neta-vps-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/neta-vps-release-${GITHUB_SHA}.tar.gz"
      - name: Deploy with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/neta-release /tmp/neta-vps-release-${GITHUB_SHA}.tar.gz"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "test -f /etc/letsencrypt/live/netarandevu.com/fullchain.pem || sudo /usr/local/sbin/neta-enable-ssl '$LETSENCRYPT_EMAIL'"
      - name: Verify production and security headers
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 12 --retry-delay 5 https://netarandevu.com/api/health
          headers="$(curl --fail --show-error --silent --retry 12 --retry-delay 5 --head https://netarandevu.com)"
          printf '%s\n' "$headers"
          for required in \
            'content-security-policy:' \
            'strict-transport-security:' \
            'x-content-type-options:' \
            'x-frame-options:' \
            'referrer-policy:'; do
            grep -qi "^${required}" <<< "$headers" || { echo "::error::Missing security header: ${required}"; exit 1; }
          done
          if grep -qi '^x-powered-by:' <<< "$headers"; then
            echo "::error::X-Powered-By must not be exposed"
            exit 1
          fi
          auth_status="$(curl --fail --show-error --silent --retry 6 --retry-delay 3 https://netarandevu.com/api/v1/auth-status)"
          AUTH_STATUS="$auth_status" node -e 'const x=JSON.parse(process.env.AUTH_STATUS||"{}"); if(x.google!==true){console.error("Google production auth is not ready"); process.exit(1)}'
      - name: Run isolated 250-user heavy synchronization test
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_load_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[loadtest]')) }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "set -a; source /etc/neta/neta.env; set +a; LOAD_TEST_USERS=250 bash /opt/neta/current/scripts/run-isolated-load-test.sh"
