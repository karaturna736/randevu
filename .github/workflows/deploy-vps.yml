name: VDS production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: "Deploy edilecek doğrulanmış release PR numarası"
        required: true
        type: string
      run_load_test:
        description: "Deploy sonrası izole 250 kullanıcı ağır eşzamanlılık testini çalıştır"
        required: false
        default: false
        type: boolean

concurrency:
  group: neta-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Resolve validated release artifact
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_PR: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            pr_number="$MANUAL_PR"
          else
            pr_number="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              | jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty')"
          fi
          test -n "$pr_number" || { echo "::error::Bu main commitine bağlı merge edilmiş release PR bulunamadı."; exit 1; }

          artifact_name="neta-vps-release-${pr_number}"
          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100")"
          run_id="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty' <<< "$artifact_json")"
          test -n "$run_id" || { echo "::error::Doğrulanmış release artifact bulunamadı: $artifact_name"; exit 1; }

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Validated release PR #$pr_number, workflow run $run_id"

      - name: Download validated release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: /tmp/neta-release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Verify release package
        run: |
          set -euo pipefail
          test -s /tmp/neta-release-artifact/neta-vps-release.tar.gz
          test -s /tmp/neta-release-artifact/neta-nginx.conf

      - name: Verify SSH host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS production secret is missing."
            exit 1
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256

      - name: Install deploy key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519

      - name: Upload validated release and Nginx policy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          SCP_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"
          timeout 8m scp $SCP_OPTS /tmp/neta-release-artifact/neta-vps-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/neta-vps-release-${GITHUB_SHA}.tar.gz"
          timeout 2m scp $SCP_OPTS /tmp/neta-release-artifact/neta-nginx.conf "$VPS_USER@$VPS_HOST:/tmp/neta-nginx-${GITHUB_SHA}.conf"

      - name: Deploy with rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          timeout 18m ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "set -e; sudo /usr/local/sbin/neta-release /tmp/neta-vps-release-${GITHUB_SHA}.tar.gz; test -f /etc/letsencrypt/live/netarandevu.com/fullchain.pem || sudo /usr/local/sbin/neta-enable-ssl '$LETSENCRYPT_EMAIL'; sudo install -o root -g root -m 0644 /tmp/neta-nginx-${GITHUB_SHA}.conf /etc/nginx/sites-available/netarandevu; sudo nginx -t; sudo systemctl reload nginx; rm -f /tmp/neta-nginx-${GITHUB_SHA}.conf"

      - name: Verify sensitive paths externally
        run: |
          set -euo pipefail
          for path in '/.git/config' '/.env' '/package.json' '/pnpm-lock.yaml' '/server.js' '/neta.sqlite' '/backup.sql'; do
            status="$(curl --connect-timeout 8 --max-time 25 --silent --show-error --retry 6 --retry-delay 3 --retry-connrefused --retry-all-errors --output /dev/null --write-out '%{http_code}' "https://netarandevu.com${path}")"
            case "$status" in
              403|404) ;;
              *) echo "::error::Sensitive path ${path} returned HTTP ${status}"; exit 1 ;;
            esac
          done

      - name: Verify production and security headers
        run: |
          set -euo pipefail
          CURL_BASE=(--connect-timeout 8 --max-time 25 --fail --show-error --silent)
          CURL_RETRY=(--retry 6 --retry-delay 3 --retry-connrefused --retry-all-errors)

          rm -f /tmp/neta-health.headers /tmp/neta-health.body
          curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" \
            --dump-header /tmp/neta-health.headers \
            --output /tmp/neta-health.body \
            https://netarandevu.com/api/health
          cat /tmp/neta-health.body
          grep -qi '^cache-control:.*no-store' /tmp/neta-health.headers || { echo "::error::API responses must be non-cacheable at the edge"; exit 1; }

          headers="$(curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" --head https://netarandevu.com)"
          printf '%s\n' "$headers"
          for required in \
            'content-security-policy:' \
            'strict-transport-security:' \
            'x-content-type-options:' \
            'x-frame-options:' \
            'referrer-policy:' \
            'permissions-policy:' \
            'cross-origin-opener-policy:' \
            'cross-origin-resource-policy:'; do
            grep -qi "^${required}" <<< "$headers" || { echo "::error::Missing security header: ${required}"; exit 1; }
          done
          grep -qi "script-src-attr 'none'" <<< "$headers" || { echo "::error::CSP must block inline event-handler attributes"; exit 1; }
          if grep -qi '^x-powered-by:' <<< "$headers"; then
            echo "::error::X-Powered-By must not be exposed"
            exit 1
          fi
          if grep -Eqi '^server:[[:space:]]*[^[:space:]]+/[0-9]' <<< "$headers"; then
            echo "::error::Web server version must not be exposed"
            exit 1
          fi

          auth_status="$(curl "${CURL_BASE[@]}" "${CURL_RETRY[@]}" https://netarandevu.com/api/v1/auth-status)"
          AUTH_STATUS="$auth_status" node -e 'const x=JSON.parse(process.env.AUTH_STATUS||"{}"); if(x.google!==true){console.error("Google production auth is not ready"); process.exit(1)}'

      - name: Run isolated 250-user heavy synchronization test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_load_test }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '94.156.11.79' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          timeout 15m ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VPS_USER@$VPS_HOST" "set -a; source /etc/neta/neta.env; set +a; LOAD_TEST_USERS=250 bash /opt/neta/current/scripts/run-isolated-load-test.sh"
