name: Apply Plus business tools patch

on:
  push:
    branches:
      - feat/plus-business-tools
    paths:
      - scripts/apply-plus-business-tools.py
      - .github/workflows/apply-plus-business-tools.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/plus-business-tools
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 scripts/apply-plus-business-tools.py
      - name: Remove one-shot patch files
        run: rm scripts/apply-plus-business-tools.py .github/workflows/apply-plus-business-tools.yml
      - name: Commit integrated Plus tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Plus işletme web sitesi API ve şube otomasyonunu bağla"
          git push origin HEAD:feat/plus-business-tools
