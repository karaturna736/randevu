name: OSV dependency review

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: osv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
