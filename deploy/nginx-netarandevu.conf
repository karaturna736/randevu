server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
limit_req_zone $binary_remote_addr zone=neta_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name netarandevu.com www.netarandevu.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://netarandevu.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.netarandevu.com;
    ssl_certificate /etc/letsencrypt/live/netarandevu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netarandevu.com/privkey.pem;
    return 301 https://netarandevu.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netarandevu.com;
    ssl_certificate /etc/letsencrypt/live/netarandevu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netarandevu.com/privkey.pem;
    client_max_body_size 2m;

    # Dotfile, secret, backup and database files must never be web-accessible.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|ini|log|sql|sqlite|sqlite3|db|bak|old|orig|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /package.json { return 404; }
    location = /pnpm-lock.yaml { return 404; }
    location = /package-lock.json { return 404; }
    location = /yarn.lock { return 404; }
    location = /server.js { return 404; }

    location /api/v1/events {
        limit_req zone=neta_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=neta_api burst=40 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
